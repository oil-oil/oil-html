<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">oil-html</title>
  <desc id="desc">一个把功能介绍、产品展示和方案说明制作成可分享单页 HTML 文档的 Skill。</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1A1A1A" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="28" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="398" rx="28" fill="url(#grid)"/>

  <g id="title-block" transform="translate(64 54)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="0" fill="#777777" font-size="18" font-weight="700" letter-spacing="2.2">SINGLE-PAGE HTML SHARE DOCS</text>
    <text x="0" y="88" fill="#1A1A1A" font-size="84" font-weight="780" letter-spacing="-4">oil-html</text>
    <rect x="0" y="116" width="430" height="18" fill="#FFE28A"/>
    <text x="2" y="143" fill="#1A1A1A" font-size="30" font-weight="650">把产品材料整理成一份可分享的 HTML。</text>
    <line x1="2" y1="194" x2="524" y2="194" stroke="#DADADA" stroke-width="2"/>
    <text x="2" y="236" fill="#555555" font-size="20">白底黑字 · 拟真 UI · 2–3 屏读完</text>
    <text x="2" y="286" fill="#999999" font-size="18"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EXPLICIT OPT-IN  /  BUILT-IN CSS  /  MIT</text>
  </g>

  <g id="html-document" transform="translate(700 44)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="0" y="0" width="438" height="312" rx="22" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="2"/>
    <rect x="0" y="0" width="438" height="48" rx="22" fill="#F7F7F8"/>
    <path d="M0 48H438" stroke="#E8E8E8" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#1A1A1A"/>
    <circle cx="44" cy="24" r="6" fill="#999999"/>
    <circle cx="64" cy="24" r="6" fill="#FFE28A" stroke="#1A1A1A" stroke-width="2"/>
    <text x="92" y="31" fill="#777777" font-size="18"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">share.html</text>

    <rect x="24" y="78" width="248" height="22" fill="#FFE28A"/>
    <rect x="24" y="84" width="304" height="15" fill="#1A1A1A"/>
    <rect x="24" y="118" width="238" height="10" rx="5" fill="#999999"/>
    <rect x="24" y="138" width="334" height="10" rx="5" fill="#D8D8D8"/>

    <g transform="translate(24 176)">
      <rect x="0" y="0" width="118" height="102" rx="12" fill="#F9F0D8"/>
      <circle cx="36" cy="34" r="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
      <path d="M36 48V78M22 61H50M36 78L25 92M36 78L47 92" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
      <rect x="18" y="14" width="82" height="70" rx="10" fill="none" stroke="#1A1A1A" stroke-opacity=".14" stroke-dasharray="4 6"/>
    </g>

    <g transform="translate(160 176)">
      <rect x="0" y="0" width="254" height="102" rx="12" fill="#F7F7F8" stroke="#E8E8E8"/>
      <text x="18" y="30" fill="#999999" font-size="18"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;section&gt;</text>
      <rect x="18" y="46" width="154" height="10" rx="5" fill="#1A1A1A"/>
      <rect x="18" y="66" width="206" height="9" rx="5" fill="#C8C8C8"/>
      <text x="183" y="91" fill="#999999" font-size="18"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;/section&gt;</text>
    </g>
  </g>
</svg>
